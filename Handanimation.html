<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverse Animation Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f0f0;
    color: #222;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 10px;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
    flex-wrap: wrap;
    flex-shrink: 0;
    z-index: 10;
  }

  .tb-sep { width: 1px; height: 28px; background: #ddd; margin: 0 3px; }
  .tb-label { font-size: 11px; color: #888; white-space: nowrap; }

  button.tb-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 32px;
    padding: 0 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    color: #333;
    white-space: nowrap;
    transition: background 0.12s, border-color 0.12s;
  }
  button.tb-btn:hover { background: #f5f5f5; border-color: #aaa; }
  button.tb-btn.active { background: #e8f0fe; border-color: #4a90e2; color: #1a56c4; }
  button.tb-btn:disabled { opacity: 0.38; cursor: not-allowed; }
  button.tb-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* canvas size modal */
  #canvas-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  #canvas-modal.open { display: flex; }
  #canvas-modal-box {
    background: #fff;
    border-radius: 12px;
    padding: 28px 32px;
    width: 320px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #canvas-modal-box h2 {
    font-size: 16px;
    font-weight: 600;
    color: #222;
  }
  .modal-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal-row label {
    font-size: 13px;
    color: #555;
    width: 60px;
    flex-shrink: 0;
  }
  .modal-row input[type=number] {
    flex: 1;
    height: 34px;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 0 10px;
    font-size: 14px;
    color: #222;
  }
  .modal-presets {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .modal-presets button {
    padding: 4px 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    background: #f5f5f5;
    font-size: 11px;
    cursor: pointer;
    color: #444;
    transition: background 0.1s;
  }
  .modal-presets button:hover { background: #e8f0fe; border-color: #4a90e2; color: #1a56c4; }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .modal-actions button {
    padding: 8px 18px;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.12s;
  }
  .modal-actions button.primary {
    background: #4a90e2;
    color: #fff;
    border-color: #4a90e2;
  }
  .modal-actions button.primary:hover { background: #357abd; }
  .modal-actions button:not(.primary):hover { background: #f5f5f5; }

  input[type=range] { height: 4px; accent-color: #4a90e2; cursor: pointer; }

  input[type=color] {
    width: 32px; height: 32px;
    border: 1px solid #ccc; border-radius: 6px;
    cursor: pointer; padding: 2px; background: #fff;
  }

  .val-label {
    font-size: 12px; font-weight: 600;
    min-width: 26px; text-align: center; color: #333;
  }

  #dir-toggle {
    display: inline-flex;
    border: 1px solid #ccc;
    border-radius: 6px;
    overflow: hidden;
    height: 32px;
    flex-shrink: 0;
  }
  #dir-toggle button {
    display: flex; align-items: center; justify-content: center;
    gap: 4px; padding: 0 9px; background: #fff;
    border: none; cursor: pointer; font-size: 12px; color: #555;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  #dir-toggle button svg { width: 14px; height: 14px; }
  #dir-toggle button.active { background: #e8f0fe; color: #1a56c4; }
  #dir-toggle button:first-child { border-right: 1px solid #ccc; }

  /* canvas area */
  #canvas-wrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    background:
      linear-gradient(45deg, #c8c8c8 25%, transparent 25%),
      linear-gradient(-45deg, #c8c8c8 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #c8c8c8 75%),
      linear-gradient(-45deg, transparent 75%, #c8c8c8 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    background-color: #e0e0e0;
  }

  #drop-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background: rgba(249,249,249,0.97);
    z-index: 5;
  }
  #drop-overlay svg.hero { width: 56px; height: 56px; color: #bbb; }
  #drop-overlay p { font-size: 15px; color: #888; }
  #drop-overlay .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #drop-overlay .big-btn {
    padding: 10px 18px; border-radius: 8px;
    border: 1px solid #ccc; background: #fff;
    font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    transition: background 0.12s; color: #333;
  }
  #drop-overlay .big-btn:hover { background: #f0f0f0; }
  #drop-overlay .big-btn svg { width: 16px; height: 16px; }
  #drop-overlay .big-btn.accent {
    background: #4a90e2; color: #fff; border-color: #4a90e2;
  }
  #drop-overlay .big-btn.accent:hover { background: #357abd; }
  #drop-overlay .sub { font-size: 12px; color: #bbb; }

  /* Wrapper per sovrapporre onion skin e canvas principale */
  #canvas-stack {
    position: relative;
    display: inline-block;
    box-shadow: 0 2px 16px rgba(0,0,0,0.15);
    z-index: 2;
  }

  /* The canvas itself — transparent bg, white shown via CSS only in editor */
  #main-canvas {
    display: block;
    cursor: crosshair;
    position: relative;
    z-index: 2;
    /* white background is just visual — canvas is actually transparent */
  }

  /* Onion skin: frame precedente in trasparenza sotto il canvas attivo */
  #onion-canvas {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Reference image: immagine di riferimento sopra il canvas, non esportata */
  #ref-canvas {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }

  #play-overlay {
    display: none; position: absolute; inset: 0;
    align-items: center; justify-content: center;
    background:
      linear-gradient(45deg, #c8c8c8 25%, transparent 25%),
      linear-gradient(-45deg, #c8c8c8 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #c8c8c8 75%),
      linear-gradient(-45deg, transparent 75%, #c8c8c8 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    background-color: #e0e0e0;
    z-index: 4;
  }
  #play-overlay.visible { display: flex; }
  #play-canvas { display: block; box-shadow: 0 2px 16px rgba(0,0,0,0.15); }

  body.drag-over #drop-overlay {
    background: rgba(232,240,254,0.97);
    border: 3px dashed #4a90e2;
  }

  /* timeline */
  #timeline {
    height: 120px; flex-shrink: 0;
    background: #fff; border-top: 1px solid #ddd;
    display: flex; flex-direction: column;
  }

  #tl-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px; border-bottom: 1px solid #eee; flex-shrink: 0;
  }
  #tl-bar span { font-size: 11px; color: #888; }
  #tl-info { margin-left: auto; font-size: 11px; color: #aaa; }

  #tl-scroll {
    display: flex; align-items: center;
    gap: 8px; padding: 8px 12px;
    overflow-x: auto; overflow-y: hidden; flex: 1;
  }
  #tl-scroll::-webkit-scrollbar { height: 4px; }
  #tl-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

  .frame-thumb {
    position: relative; flex-shrink: 0;
    width: 72px; height: 72px;
    border: 2px solid #ddd; border-radius: 6px;
    cursor: pointer;
    background:
      linear-gradient(45deg, #ddd 25%, transparent 25%),
      linear-gradient(-45deg, #ddd 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ddd 75%),
      linear-gradient(-45deg, transparent 75%, #ddd 75%);
    background-size: 10px 10px;
    background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
    background-color: #f5f5f5;
    overflow: hidden; transition: border-color 0.12s;
  }
  .frame-thumb.active { border-color: #4a90e2; box-shadow: 0 0 0 2px #bdd4f8; }
  .frame-thumb canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .frame-num {
    position: absolute; bottom: 2px; left: 4px;
    font-size: 10px; font-weight: 700;
    color: rgba(0,0,0,0.5); pointer-events: none; text-shadow: 0 0 3px #fff;
  }
  .frame-del {
    position: absolute; top: 2px; right: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #fff;
    font-size: 11px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0; border: none; line-height: 1;
    transition: opacity 0.12s;
  }
  .frame-thumb:hover .frame-del { opacity: 1; }

  #add-frame-btn {
    flex-shrink: 0; width: 72px; height: 72px;
    border: 1.5px dashed #bbb; border-radius: 6px;
    cursor: pointer; background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; color: #aaa; font-size: 11px;
    transition: border-color 0.12s, color 0.12s;
  }
  #add-frame-btn:hover { border-color: #4a90e2; color: #4a90e2; }
  #add-frame-btn svg { width: 22px; height: 22px; }

  #toast {
    position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 8px 18px;
    border-radius: 20px; font-size: 13px; opacity: 0;
    pointer-events: none; transition: opacity 0.25s; z-index: 300;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- Canvas size modal -->
<div id="canvas-modal">
  <div id="canvas-modal-box">
    <h2>Nuovo canvas</h2>
    <div class="modal-presets">
      <button data-w="800" data-h="600">800×600</button>
      <button data-w="1280" data-h="720">1280×720 HD</button>
      <button data-w="1920" data-h="1080">1920×1080 Full HD</button>
      <button data-w="1080" data-h="1080">1080×1080 Square</button>
      <button data-w="1080" data-h="1920">1080×1920 Story</button>
    </div>
    <div class="modal-row">
      <label>Larghezza</label>
      <input type="number" id="modal-w" value="800" min="100" max="4096">
      <span style="font-size:12px;color:#aaa">px</span>
    </div>
    <div class="modal-row">
      <label>Altezza</label>
      <input type="number" id="modal-h" value="600" min="100" max="4096">
      <span style="font-size:12px;color:#aaa">px</span>
    </div>
    <div class="modal-actions">
      <button id="modal-cancel">Annulla</button>
      <button class="primary" id="modal-ok">Crea canvas</button>
    </div>
  </div>
</div>

<div id="toolbar">
  <!-- Importa immagine -->
  <button class="tb-btn" id="btn-import" title="Importa immagine">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    Importa
  </button>
  <input type="file" id="file-input" accept="image/*" style="display:none">

  <!-- Reference image -->
  <button class="tb-btn" id="btn-ref" title="Carica immagine di riferimento (solo visiva, non esportata)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><circle cx="8" cy="6" r="1"/></svg>
    Ref
  </button>
  <input type="file" id="ref-input" accept="image/*" style="display:none">
  <span class="tb-label" id="ref-label" style="display:none;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#4a90e2"></span>
  <button class="tb-btn" id="btn-ref-toggle" style="display:none" title="Mostra/nascondi reference">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    Visibile
  </button>
  <input type="range" id="ref-opacity" min="5" max="100" value="40" style="width:50px;display:none" title="Opacità reference">
  <span class="val-label" id="ref-opacity-val" style="display:none">40%</span>
  <button class="tb-btn" id="btn-ref-remove" style="display:none;color:#c00;border-color:#fcc" title="Rimuovi reference">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>

  <!-- Add canvas vuoto -->
  <button class="tb-btn" id="btn-add-canvas" title="Nuovo canvas vuoto trasparente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    Add canvas
  </button>

  <div class="tb-sep"></div>

  <!-- Strumenti -->
  <button class="tb-btn active" id="btn-erase" title="Gomma — riporta a trasparente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16l10-10 7 7-2.5 2.5"/><path d="m6 11 7 7"/></svg>
    Gomma
  </button>
  <button class="tb-btn" id="btn-draw" title="Pennello (disegna su trasparente)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>
    Disegna
  </button>
  <input type="color" id="color-pick" value="#000000" title="Colore pennello">

  <!-- Opacità colore -->
  <span class="tb-label">Opacità</span>
  <input type="range" id="opacity-slider" min="1" max="100" value="100" style="width:55px">
  <span class="val-label" id="opacity-val">100%</span>

  <span class="tb-label" style="margin-left:2px">Dim</span>
  <input type="range" id="brush-size" min="1" max="100" value="20" style="width:55px">
  <span class="val-label" id="brush-val">20</span>

  <div class="tb-sep"></div>

  <!-- Undo / Redo -->
  <button class="tb-btn" id="btn-undo" disabled title="Annulla (Ctrl+Z)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
    Undo
  </button>
  <button class="tb-btn" id="btn-redo" disabled title="Ripeti (Ctrl+Y)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
    Redo
  </button>

  <div class="tb-sep"></div>

  <!-- Play -->
  <button class="tb-btn" id="btn-play" title="Play / Pausa (Spazio)">
    <svg id="play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    <span id="play-label">Play</span>
  </button>
  <div id="dir-toggle" title="Direzione playback">
    <button id="btn-fwd" class="active" title="In avanti">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 12 19 12"/><polyline points="13 6 19 12 13 18"/></svg>
      Avanti
    </button>
    <button id="btn-rev" title="Reverse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="19 12 5 12"/><polyline points="11 6 5 12 11 18"/></svg>
      Reverse
    </button>
  </div>
  <span class="tb-label">FPS</span>
  <input type="range" id="speed" min="1" max="24" value="6" style="width:55px">
  <span class="val-label" id="speed-val">6</span>

  <div class="tb-sep"></div>

  <!-- Progetto -->
  <button class="tb-btn" id="btn-save-json" title="Salva progetto JSON">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    Salva
  </button>
  <button class="tb-btn" id="btn-load-json" title="Carica progetto JSON">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><polyline points="9 14 12 17 15 14"/></svg>
    Carica
  </button>
  <input type="file" id="json-input" accept=".json" style="display:none">

  <div class="tb-sep"></div>

  <!-- Onion skin -->
  <button class="tb-btn active" id="btn-onion" title="Onion skin — mostra frame precedente in trasparenza">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
    Onion
  </button>
  <span class="tb-label">Opac.</span>
  <input type="range" id="onion-opacity" min="5" max="80" value="30" style="width:50px">
  <span class="val-label" id="onion-opacity-val">30%</span>

  <div class="tb-sep"></div>

  <!-- Export PNG -->
  <button class="tb-btn" id="btn-export" title="Esporta frame PNG trasparenti">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Esporta PNG
  </button>
</div>

<!-- CANVAS AREA -->
<div id="canvas-wrap">
  <div id="drop-overlay">
    <svg class="hero" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    <p>Crea un canvas vuoto, importa un'immagine o carica un progetto</p>
    <div class="btn-row">
      <button class="big-btn accent" id="btn-drop-canvas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Nuovo canvas
      </button>
      <button class="big-btn" id="btn-drop-import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Importa immagine
      </button>
      <button class="big-btn" id="btn-drop-json">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Carica progetto
      </button>
    </div>
    <p class="sub">oppure trascina qui un file immagine o .json</p>
  </div>

  <div id="canvas-stack">
    <canvas id="onion-canvas"></canvas>
    <canvas id="main-canvas"></canvas>
    <canvas id="ref-canvas"></canvas>
  </div>

  <div id="play-overlay">
    <canvas id="play-canvas"></canvas>
  </div>
</div>

<!-- TIMELINE -->
<div id="timeline">
  <div id="tl-bar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    <span>Timeline</span>
    <span id="tl-info"></span>
  </div>
  <div id="tl-scroll">
    <button id="add-frame-btn" title="Aggiungi frame">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>frame</span>
    </button>
  </div>
</div>

<div id="toast"></div>

<script>
const mainCanvas  = document.getElementById('main-canvas');
const ctx         = mainCanvas.getContext('2d');
const onionCanvas = document.getElementById('onion-canvas');
const octx        = onionCanvas.getContext('2d');
const refCanvas   = document.getElementById('ref-canvas');
const rctx        = refCanvas.getContext('2d');
const playCanvas  = document.getElementById('play-canvas');
const pctx        = playCanvas.getContext('2d');
const tlScroll    = document.getElementById('tl-scroll');
const addFrameBtn = document.getElementById('add-frame-btn');
const dropOverlay = document.getElementById('drop-overlay');
const playOverlay = document.getElementById('play-overlay');
const brushSlider = document.getElementById('brush-size');
const brushValEl  = document.getElementById('brush-val');
const opacitySlider = document.getElementById('opacity-slider');
const opacityValEl  = document.getElementById('opacity-val');
const speedSlider = document.getElementById('speed');
const speedValEl  = document.getElementById('speed-val');
const colorPick   = document.getElementById('color-pick');
const tlInfo      = document.getElementById('tl-info');
const playIcon    = document.getElementById('play-icon');
const playLabel   = document.getElementById('play-label');
const toastEl     = document.getElementById('toast');

// ── State ──
let sourceImg   = null;   // null when blank canvas
let imgW = 800, imgH = 600;
let frames      = [];
let undoStacks  = [];
let redoStacks  = [];
let currentFrame = -1;
let tool        = 'erase';
let isDrawing   = false;
let lastX = 0, lastY = 0;
let snapBeforeDraw = null;
let isPlaying   = false;
let playInterval = null;
let playReverse = false;
let onionEnabled = true;
let refImg      = null;   // immagine di riferimento (solo visiva)
let refVisible  = true;

// ── Toast ──
let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

// ── Canvas modal ──
const canvasModal = document.getElementById('canvas-modal');
const modalW = document.getElementById('modal-w');
const modalH = document.getElementById('modal-h');

document.querySelectorAll('.modal-presets button').forEach(btn => {
  btn.addEventListener('click', () => {
    modalW.value = btn.dataset.w;
    modalH.value = btn.dataset.h;
  });
});
document.getElementById('modal-cancel').addEventListener('click', () => {
  canvasModal.classList.remove('open');
});
document.getElementById('modal-ok').addEventListener('click', () => {
  const w = Math.max(100, Math.min(4096, parseInt(modalW.value) || 800));
  const h = Math.max(100, Math.min(4096, parseInt(modalH.value) || 600));
  canvasModal.classList.remove('open');
  createBlankCanvas(w, h);
});

function openCanvasModal() {
  canvasModal.classList.add('open');
}

// ── Create blank canvas (fully transparent) ──
function createBlankCanvas(w, h) {
  imgW = w; imgH = h;
  mainCanvas.width  = imgW;
  mainCanvas.height = imgH;
  onionCanvas.width  = imgW;
  onionCanvas.height = imgH;
  refCanvas.width   = imgW;
  refCanvas.height  = imgH;
  playCanvas.width  = imgW;
  playCanvas.height = imgH;
  sourceImg = null;
  frames = [];
  undoStacks = [];
  redoStacks = [];
  currentFrame = -1;
  dropOverlay.style.display = 'none';
  // Canvas vuoto → onion skin attivo
  onionEnabled = true;
  document.getElementById('btn-onion').classList.add('active');
  scaleCanvas();
  // start with one blank transparent frame
  addBlankFrame();
}

function blankFrameData() {
  // pure transparent PNG
  const tmp = document.createElement('canvas');
  tmp.width = imgW; tmp.height = imgH;
  // nothing drawn = fully transparent
  return tmp.toDataURL('image/png');
}

function addBlankFrame() {
  if (currentFrame >= 0 && currentFrame < frames.length) {
    frames[currentFrame].data = getCanvasDataURL();
    updateThumb(currentFrame);
  }
  const newData = blankFrameData();
  const idx = frames.length;
  frames.push({ data: newData });
  undoStacks.push([]);
  redoStacks.push([]);
  currentFrame = idx;
  setCanvasDataURL(newData, () => { renderTimeline(); updateUndoRedo(); updateTlInfo(); });
}

// ── Onion skin ──
function drawOnionSkin() {
  const opVal = parseInt(document.getElementById('onion-opacity').value) / 100;
  octx.clearRect(0, 0, imgW, imgH);
  if (!onionEnabled || currentFrame <= 0 || frames.length < 2) return;
  const prevData = frames[currentFrame - 1].data;
  const img = new Image();
  img.onload = () => {
    octx.globalAlpha = opVal;
    octx.drawImage(img, 0, 0);
    octx.globalAlpha = 1;
  };
  img.src = prevData;
}

function clearOnionSkin() {
  octx.clearRect(0, 0, imgW, imgH);
}

// ── Reference image ──
function drawRefImage() {
  rctx.clearRect(0, 0, refCanvas.width, refCanvas.height);
  if (!refImg || !refVisible) return;
  const op = parseInt(document.getElementById('ref-opacity').value) / 100;
  rctx.globalAlpha = op;
  rctx.drawImage(refImg, 0, 0, refCanvas.width, refCanvas.height);
  rctx.globalAlpha = 1;
}

function setRefControls(hasRef) {
  document.getElementById('ref-label').style.display    = hasRef ? '' : 'none';
  document.getElementById('btn-ref-toggle').style.display = hasRef ? '' : 'none';
  document.getElementById('ref-opacity').style.display  = hasRef ? '' : 'none';
  document.getElementById('ref-opacity-val').style.display = hasRef ? '' : 'none';
  document.getElementById('btn-ref-remove').style.display = hasRef ? '' : 'none';
}

// ── Scale ──
function scaleCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const aw = wrap.clientWidth - 40;
  const ah = wrap.clientHeight - 40;
  const scale = Math.min(aw / imgW, ah / imgH, 1);
  const sw = Math.round(imgW * scale);
  const sh = Math.round(imgH * scale);
  mainCanvas.style.width  = sw + 'px';
  mainCanvas.style.height = sh + 'px';
  onionCanvas.style.width  = sw + 'px';
  onionCanvas.style.height = sh + 'px';
  refCanvas.style.width   = sw + 'px';
  refCanvas.style.height  = sh + 'px';
  playCanvas.style.width  = sw + 'px';
  playCanvas.style.height = sh + 'px';
}

function getCanvasDataURL() { return mainCanvas.toDataURL('image/png'); }

function setCanvasDataURL(dataURL, cb) {
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, imgW, imgH);
    ctx.drawImage(img, 0, 0);
    drawOnionSkin();
    if (cb) cb();
  };
  img.src = dataURL;
}

// ── Load image ──
function loadImage(src, afterCb) {
  const img = new Image();
  img.onload = () => {
    imgW = img.width; imgH = img.height;
    mainCanvas.width  = imgW; mainCanvas.height = imgH;
    onionCanvas.width  = imgW; onionCanvas.height = imgH;
    refCanvas.width   = imgW; refCanvas.height  = imgH;
    playCanvas.width  = imgW; playCanvas.height = imgH;
    sourceImg = img;
    frames = []; undoStacks = []; redoStacks = [];
    currentFrame = -1;
    dropOverlay.style.display = 'none';
    // Immagine importata → onion skin disattivato (si cancella sopra l'originale)
    onionEnabled = false;
    document.getElementById('btn-onion').classList.remove('active');
    clearOnionSkin();
    scaleCanvas();
    if (afterCb) afterCb();
    else {
      // first frame: draw image (transparent bg preserved)
      addImageFrame(true);
    }
  };
  img.src = src;
}

// Add a frame starting from the source image (used only on first load)
function addImageFrame(first) {
  if (currentFrame >= 0 && currentFrame < frames.length) {
    frames[currentFrame].data = getCanvasDataURL();
    updateThumb(currentFrame);
  }
  let newData;
  if (first || currentFrame < 0) {
    // draw source image onto transparent canvas
    const tmp = document.createElement('canvas');
    tmp.width = imgW; tmp.height = imgH;
    tmp.getContext('2d').drawImage(sourceImg, 0, 0);
    newData = tmp.toDataURL('image/png');
  } else {
    newData = frames[currentFrame].data;
  }
  const idx = frames.length;
  frames.push({ data: newData });
  undoStacks.push([]);
  redoStacks.push([]);
  currentFrame = idx;
  setCanvasDataURL(newData, () => { renderTimeline(); updateUndoRedo(); updateTlInfo(); });
}

// ── Generic addFrame (works for both blank & image projects) ──
function addFrame() {
  if (currentFrame >= 0 && currentFrame < frames.length) {
    frames[currentFrame].data = getCanvasDataURL();
    updateThumb(currentFrame);
  }
  // Con immagine importata: copia il frame corrente (per reverse motion si cancella)
  // Con canvas vuoto: frame trasparente + onion skin mostra il precedente
  const newData = sourceImg
    ? frames[currentFrame].data
    : blankFrameData();
  const idx = frames.length;
  frames.push({ data: newData });
  undoStacks.push([]);
  redoStacks.push([]);
  currentFrame = idx;
  setCanvasDataURL(newData, () => { renderTimeline(); updateUndoRedo(); updateTlInfo(); });
}

function deleteFrame(idx) {
  if (frames.length <= 1) return;
  frames.splice(idx, 1);
  undoStacks.splice(idx, 1);
  redoStacks.splice(idx, 1);
  if (currentFrame >= frames.length) currentFrame = frames.length - 1;
  setCanvasDataURL(frames[currentFrame].data, () => { renderTimeline(); updateUndoRedo(); updateTlInfo(); });
}

function switchToFrame(idx) {
  if (currentFrame >= 0 && currentFrame < frames.length) {
    frames[currentFrame].data = getCanvasDataURL();
    updateThumb(currentFrame);
  }
  currentFrame = idx;
  setCanvasDataURL(frames[idx].data, () => { renderTimeline(); updateUndoRedo(); updateTlInfo(); });
}

// ── Undo / Redo ──
function commitStroke() {
  frames[currentFrame].data = getCanvasDataURL();
  updateThumb(currentFrame);
  updateUndoRedo();
}

function undo() {
  if (currentFrame < 0 || !undoStacks[currentFrame].length) return;
  redoStacks[currentFrame].push(frames[currentFrame].data);
  const prev = undoStacks[currentFrame].pop();
  frames[currentFrame].data = prev;
  setCanvasDataURL(prev, () => { updateThumb(currentFrame); updateUndoRedo(); });
}

function redo() {
  if (currentFrame < 0 || !redoStacks[currentFrame].length) return;
  undoStacks[currentFrame].push(frames[currentFrame].data);
  const next = redoStacks[currentFrame].pop();
  frames[currentFrame].data = next;
  setCanvasDataURL(next, () => { updateThumb(currentFrame); updateUndoRedo(); });
}

function updateUndoRedo() {
  document.getElementById('btn-undo').disabled =
    currentFrame < 0 || !undoStacks[currentFrame] || !undoStacks[currentFrame].length;
  document.getElementById('btn-redo').disabled =
    currentFrame < 0 || !redoStacks[currentFrame] || !redoStacks[currentFrame].length;
}

function updateTlInfo() {
  tlInfo.textContent = frames.length ? `Frame ${currentFrame + 1} / ${frames.length}` : '';
}

// ── Thumbnails ──
function updateThumb(idx) {
  const thumbs = tlScroll.querySelectorAll('.frame-thumb');
  const el = thumbs[idx];
  if (!el) return;
  const tc = el.querySelector('canvas');
  const ttx = tc.getContext('2d');
  const img = new Image();
  img.onload = () => { ttx.clearRect(0, 0, tc.width, tc.height); ttx.drawImage(img, 0, 0, tc.width, tc.height); };
  img.src = frames[idx].data;
}

function renderTimeline() {
  tlScroll.querySelectorAll('.frame-thumb').forEach(e => e.remove());
  frames.forEach((f, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'frame-thumb' + (i === currentFrame ? ' active' : '');
    const tc = document.createElement('canvas');
    tc.width = 72; tc.height = 72;
    const ttx = tc.getContext('2d');
    const img = new Image();
    img.onload = () => { ttx.clearRect(0, 0, 72, 72); ttx.drawImage(img, 0, 0, 72, 72); };
    img.src = f.data;
    const num = document.createElement('span');
    num.className = 'frame-num';
    num.textContent = i + 1;
    const del = document.createElement('button');
    del.className = 'frame-del';
    del.textContent = '×';
    del.title = 'Elimina frame';
    del.addEventListener('click', e => { e.stopPropagation(); deleteFrame(i); });
    wrap.appendChild(tc); wrap.appendChild(num); wrap.appendChild(del);
    wrap.addEventListener('click', () => switchToFrame(i));
    tlScroll.insertBefore(wrap, addFrameBtn);
  });
  updateTlInfo();
  const thumbs = tlScroll.querySelectorAll('.frame-thumb');
  if (thumbs[currentFrame]) {
    thumbs[currentFrame].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
  }
}

// ── Drawing ──
function getPos(e) {
  const rect = mainCanvas.getBoundingClientRect();
  const sx = mainCanvas.width / rect.width;
  const sy = mainCanvas.height / rect.height;
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function applyStroke(x1, y1, x2, y2) {
  const size = parseInt(brushSlider.value);
  const opacity = parseInt(opacitySlider.value) / 100;
  ctx.lineWidth = size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (tool === 'erase') {
    // erase: restore transparency
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = `rgba(0,0,0,${opacity})`;
  } else {
    // draw: paint with chosen color+opacity on transparent canvas
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = hexToRgba(colorPick.value, opacity);
  }
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}

function startDraw(e) {
  if (currentFrame < 0 || !frames.length) return;
  isDrawing = true;
  const pos = getPos(e);
  lastX = pos.x; lastY = pos.y;
  snapBeforeDraw = getCanvasDataURL();
  applyStroke(pos.x, pos.y, pos.x, pos.y);
}
function draw(e) {
  if (!isDrawing) return;
  const pos = getPos(e);
  applyStroke(lastX, lastY, pos.x, pos.y);
  lastX = pos.x; lastY = pos.y;
}
function endDraw() {
  if (!isDrawing) return;
  isDrawing = false;
  if (snapBeforeDraw !== null) {
    undoStacks[currentFrame].push(snapBeforeDraw);
    if (undoStacks[currentFrame].length > 50) undoStacks[currentFrame].shift();
    redoStacks[currentFrame] = [];
    snapBeforeDraw = null;
  }
  commitStroke();
}

mainCanvas.addEventListener('mousedown', startDraw);
mainCanvas.addEventListener('mousemove', draw);
mainCanvas.addEventListener('mouseup', endDraw);
mainCanvas.addEventListener('mouseleave', endDraw);
mainCanvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e); }, { passive: false });
mainCanvas.addEventListener('touchmove',  e => { e.preventDefault(); draw(e); },      { passive: false });
mainCanvas.addEventListener('touchend', endDraw);

// ── Play ──
function setPlayIcons(playing) {
  if (playing) {
    playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    playLabel.textContent = 'Pausa';
  } else {
    playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    playLabel.textContent = 'Play';
  }
}

function startPlay() {
  if (!frames.length) return;
  if (currentFrame >= 0 && currentFrame < frames.length) {
    frames[currentFrame].data = getCanvasDataURL();
  }
  isPlaying = true;
  setPlayIcons(true);
  playOverlay.classList.add('visible');
  playCanvas.width = imgW; playCanvas.height = imgH;
  const total = frames.length;
  let idx = playReverse ? total - 1 : 0;
  function showFrame() {
    const img = new Image();
    img.onload = () => { pctx.clearRect(0, 0, imgW, imgH); pctx.drawImage(img, 0, 0); };
    img.src = frames[idx].data;
    idx = playReverse ? (idx - 1 + total) % total : (idx + 1) % total;
  }
  showFrame();
  const fps = parseInt(speedSlider.value);
  playInterval = setInterval(showFrame, Math.round(1000 / fps));
}

function stopPlay() {
  isPlaying = false;
  clearInterval(playInterval); playInterval = null;
  setPlayIcons(false);
  playOverlay.classList.remove('visible');
}

// ── Direction ──
document.getElementById('btn-fwd').addEventListener('click', () => {
  playReverse = false;
  document.getElementById('btn-fwd').classList.add('active');
  document.getElementById('btn-rev').classList.remove('active');
  if (isPlaying) { stopPlay(); startPlay(); }
});
document.getElementById('btn-rev').addEventListener('click', () => {
  playReverse = true;
  document.getElementById('btn-rev').classList.add('active');
  document.getElementById('btn-fwd').classList.remove('active');
  if (isPlaying) { stopPlay(); startPlay(); }
});

// ── Save JSON ──
function saveProject() {
  if (!frames.length) { showToast('Nessun progetto da salvare'); return; }
  if (currentFrame >= 0 && currentFrame < frames.length) {
    frames[currentFrame].data = getCanvasDataURL();
  }
  const sourceData = sourceImg ? (() => {
    const tmp = document.createElement('canvas');
    tmp.width = imgW; tmp.height = imgH;
    tmp.getContext('2d').drawImage(sourceImg, 0, 0);
    return tmp.toDataURL('image/png');
  })() : null;
  const project = {
    version: 2,
    imgW, imgH,
    fps: parseInt(speedSlider.value),
    sourceImgData: sourceData,
    frames: frames.map(f => ({ data: f.data }))
  };
  const blob = new Blob([JSON.stringify(project)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'progetto_animazione.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  showToast('Progetto salvato ✓');
}

// ── Load JSON ──
function loadProject(jsonStr) {
  let project;
  try { project = JSON.parse(jsonStr); } catch(e) { showToast('File JSON non valido'); return; }
  if (!project.frames) { showToast('Progetto non riconosciuto'); return; }

  imgW = project.imgW || 800;
  imgH = project.imgH || 600;
  mainCanvas.width  = imgW; mainCanvas.height = imgH;
  onionCanvas.width  = imgW; onionCanvas.height = imgH;
  refCanvas.width   = imgW; refCanvas.height  = imgH;
  playCanvas.width  = imgW; playCanvas.height = imgH;

  if (project.fps) { speedSlider.value = project.fps; speedValEl.textContent = project.fps; }

  function restoreFrames() {
    frames = project.frames.map(f => ({ data: f.data }));
    undoStacks = frames.map(() => []);
    redoStacks = frames.map(() => []);
    currentFrame = frames.length - 1;
    dropOverlay.style.display = 'none';
    scaleCanvas();
    setCanvasDataURL(frames[currentFrame].data, () => {
      renderTimeline(); updateUndoRedo(); updateTlInfo();
      showToast(`Progetto caricato — ${frames.length} frame ✓`);
    });
  }

  if (project.sourceImgData) {
    const img = new Image();
    img.onload = () => { sourceImg = img; restoreFrames(); };
    img.src = project.sourceImgData;
  } else {
    sourceImg = null;
    restoreFrames();
  }
}

// ── Export PNG → ZIP ──
async function exportFrames() {
  if (!frames.length) return;
  if (currentFrame >= 0 && currentFrame < frames.length) {
    frames[currentFrame].data = getCanvasDataURL();
  }
  showToast(`Creazione ZIP con ${frames.length} frame...`);

  // Carica JSZip dinamicamente se non già presente
  if (typeof JSZip === 'undefined') {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }

  const zip = new JSZip();
  const folder = zip.folder('frames');

  for (let i = 0; i < frames.length; i++) {
    // Converti dataURL base64 → blob binario
    const dataURL = frames[i].data;
    const base64 = dataURL.split(',')[1];
    folder.file('frame_' + String(i + 1).padStart(3, '0') + '.png', base64, { base64: true });
  }

  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'frames_animazione.zip';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  showToast(`ZIP con ${frames.length} frame scaricato ✓`);
}

// ── Button wiring ──
document.getElementById('btn-import').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('btn-drop-import').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('btn-add-canvas').addEventListener('click', openCanvasModal);
document.getElementById('btn-drop-canvas').addEventListener('click', openCanvasModal);
document.getElementById('btn-drop-json').addEventListener('click', () => document.getElementById('json-input').click());

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => loadImage(ev.target.result, null);
  r.readAsDataURL(file);
  e.target.value = '';
});

addFrameBtn.addEventListener('click', () => { if (frames.length > 0 || sourceImg) addFrame(); });

document.getElementById('btn-erase').addEventListener('click', () => {
  tool = 'erase';
  document.getElementById('btn-erase').classList.add('active');
  document.getElementById('btn-draw').classList.remove('active');
});
document.getElementById('btn-draw').addEventListener('click', () => {
  tool = 'draw';
  document.getElementById('btn-draw').classList.add('active');
  document.getElementById('btn-erase').classList.remove('active');
});

document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-redo').addEventListener('click', redo);

brushSlider.addEventListener('input', () => { brushValEl.textContent = brushSlider.value; });
opacitySlider.addEventListener('input', () => { opacityValEl.textContent = opacitySlider.value + '%'; });
speedSlider.addEventListener('input', () => {
  speedValEl.textContent = speedSlider.value;
  if (isPlaying) { stopPlay(); startPlay(); }
});

document.getElementById('btn-play').addEventListener('click', () => {
  if (!frames.length) return;
  isPlaying ? stopPlay() : startPlay();
});

document.getElementById('btn-save-json').addEventListener('click', saveProject);
document.getElementById('btn-load-json').addEventListener('click', () => document.getElementById('json-input').click());

document.getElementById('json-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => loadProject(ev.target.result);
  r.readAsText(file);
  e.target.value = '';
});

document.getElementById('btn-export').addEventListener('click', exportFrames);

// ── Reference image controls ──
document.getElementById('btn-ref').addEventListener('click', () => {
  document.getElementById('ref-input').click();
});

document.getElementById('ref-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    const img = new Image();
    img.onload = () => {
      refImg = img;
      refVisible = true;
      refCanvas.width  = imgW;
      refCanvas.height = imgH;
      drawRefImage();
      setRefControls(true);
      const label = document.getElementById('ref-label');
      label.textContent = '📌 ' + file.name.replace(/\.[^.]+$/, '');
      const toggleBtn = document.getElementById('btn-ref-toggle');
      toggleBtn.classList.add('active');
      toggleBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Visibile';
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(file);
  e.target.value = '';
});

document.getElementById('btn-ref-toggle').addEventListener('click', () => {
  refVisible = !refVisible;
  const btn = document.getElementById('btn-ref-toggle');
  btn.classList.toggle('active', refVisible);
  btn.innerHTML = refVisible
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Visibile'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg> Nascosta';
  drawRefImage();
});

document.getElementById('ref-opacity').addEventListener('input', () => {
  document.getElementById('ref-opacity-val').textContent = document.getElementById('ref-opacity').value + '%';
  drawRefImage();
});

document.getElementById('btn-ref-remove').addEventListener('click', () => {
  refImg = null;
  refVisible = true;
  rctx.clearRect(0, 0, refCanvas.width, refCanvas.height);
  setRefControls(false);
});

// ── Onion skin controls ──
const onionOpacitySlider = document.getElementById('onion-opacity');
const onionOpacityVal    = document.getElementById('onion-opacity-val');

document.getElementById('btn-onion').addEventListener('click', () => {
  onionEnabled = !onionEnabled;
  document.getElementById('btn-onion').classList.toggle('active', onionEnabled);
  onionEnabled ? drawOnionSkin() : clearOnionSkin();
});

onionOpacitySlider.addEventListener('input', () => {
  onionOpacityVal.textContent = onionOpacitySlider.value + '%';
  if (onionEnabled) drawOnionSkin();
});

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (e.shiftKey && e.key.toLowerCase() === 'z' || e.key.toLowerCase() === 'y')) { e.preventDefault(); redo(); }
  if (e.key === ' ' && frames.length) { e.preventDefault(); isPlaying ? stopPlay() : startPlay(); }
  if (e.key === 'Escape') { canvasModal.classList.remove('open'); if (isPlaying) stopPlay(); }
});

// ── Drag & drop ──
document.body.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag-over'); });
document.body.addEventListener('dragleave', () => document.body.classList.remove('drag-over'));
document.body.addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('drag-over');
  const file = e.dataTransfer.files[0]; if (!file) return;
  if (file.type.startsWith('image/')) {
    const r = new FileReader();
    r.onload = ev => loadImage(ev.target.result, null);
    r.readAsDataURL(file);
  } else if (file.name.endsWith('.json')) {
    const r = new FileReader();
    r.onload = ev => loadProject(ev.target.result);
    r.readAsText(file);
  }
});

window.addEventListener('resize', scaleCanvas);
</script>
</body>
</html>
